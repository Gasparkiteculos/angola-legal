services:
  angola-legal:
    image: angola-legal:0.10.0
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ANGOLA_HOST: 0.0.0.0
      ANGOLA_PORT: 8000
      ANGOLA_THREADS: ${ANGOLA_THREADS:-8}
      ANGOLA_CONNECTION_LIMIT: ${ANGOLA_CONNECTION_LIMIT:-128}
      ANGOLA_CHANNEL_TIMEOUT: ${ANGOLA_CHANNEL_TIMEOUT:-30}
      ANGOLA_RATE_LIMIT_PER_MINUTE: ${ANGOLA_RATE_LIMIT_PER_MINUTE:-60}
      ANGOLA_RATE_LIMIT_BURST: ${ANGOLA_RATE_LIMIT_BURST:-120}
      ANGOLA_TRUSTED_PROXY: 172.29.0.2
      ANGOLA_PUBLIC_BASE_URL: ${ANGOLA_PUBLIC_BASE_URL:?Set the verified HTTPS origin in .env}
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      app_net:
        ipv4_address: 172.29.0.3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      ANGOLA_DOMAIN: ${ANGOLA_DOMAIN:?Set a domain you control and have verified}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      angola-legal:
        condition: service_healthy
    networks:
      app_net:
        ipv4_address: 172.29.0.2
      edge: {}

networks:
  app_net:
    internal: true
    ipam:
      config:
        - subnet: 172.29.0.0/24
  edge:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
