services:
  angola-legal:
    build: .
    restart: unless-stopped
    environment:
      ANGOLA_HOST: 0.0.0.0
      ANGOLA_PORT: 8000
      ANGOLA_THREADS: ${ANGOLA_THREADS:-8}
      ANGOLA_CONNECTION_LIMIT: ${ANGOLA_CONNECTION_LIMIT:-128}
      ANGOLA_CHANNEL_TIMEOUT: ${ANGOLA_CHANNEL_TIMEOUT:-30}
      ANGOLA_RATE_LIMIT_PER_MINUTE: ${ANGOLA_RATE_LIMIT_PER_MINUTE:-60}
      ANGOLA_RATE_LIMIT_BURST: ${ANGOLA_RATE_LIMIT_BURST:-120}
      ANGOLA_PUBLIC_BASE_URL: ${ANGOLA_PUBLIC_BASE_URL:-}
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
