name: Validate metadata

on:
  push:
    paths:
      - "schemas/**"
      - "records/**"
      - "scripts/**"
      - "requirements-dev.txt"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "schemas/**"
      - "records/**"
      - "scripts/**"
      - "requirements-dev.txt"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_metadata.py records/examples/illustrative-record.json
