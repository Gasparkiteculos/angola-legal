name: Validate and secure Angola Legal

on:
  push:
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "docker-compose.production.yml"
      - ".dockerignore"
      - ".env.example"
      - "deploy/**"
      - "web/**"
      - "coverage/**"
      - "docs/**"
      - "schemas/**"
      - "sources/**"
      - "records/**"
      - "scripts/**"
      - "tests/**"
      - "requirements*.txt"
      - "VERSION"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "docker-compose.production.yml"
      - ".dockerignore"
      - ".env.example"
      - "deploy/**"
      - "web/**"
      - "coverage/**"
      - "docs/**"
      - "schemas/**"
      - "sources/**"
      - "records/**"
      - "scripts/**"
      - "tests/**"
      - "requirements*.txt"
      - "VERSION"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_metadata.py records/examples/illustrative-record.json records/angola/*.json
      - run: python scripts/validate_sources.py
      - run: python -m unittest discover -s tests
      - run: python -c "import json; from jsonschema import Draft202012Validator, FormatChecker; schema=json.load(open('schemas/catalogue-coverage.schema.json', encoding='utf-8')); data=json.load(open('coverage/catalogue-coverage.json', encoding='utf-8')); Draft202012Validator.check_schema(schema); Draft202012Validator(schema, format_checker=FormatChecker()).validate(data)"
      - run: python scripts/catalog.py check-graph
      - run: python scripts/catalog.py coverage
      - run: python -m py_compile scripts/api.py scripts/production.py scripts/catalog.py scripts/validate_production_config.py
      - run: node --check web/app.js
      - run: pip-audit --requirement requirements.txt
      - run: docker compose config --quiet
      - run: python scripts/validate_deployment.py
      - run: python scripts/validate_production_config.py
      - name: Validate production Caddy configuration
        run: docker run --rm --env ANGOLA_DOMAIN=deployment-check.example.invalid -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build and smoke-test the locked-down container
        env:
          ANGOLA_TRUSTED_PROXY: ""
        run: |
          docker compose up --build --detach --wait
          python scripts/smoke_deployment.py
      - name: Stop test containers
        if: always()
        run: docker compose down --remove-orphans
