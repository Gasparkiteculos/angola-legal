name: Validate document metadata and source registry

on:
  push:
    paths:
      - "schemas/**"
      - "sources/**"
      - "records/**"
      - "scripts/**"
      - "tests/**"
      - "requirements-dev.txt"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "schemas/**"
      - "sources/**"
      - "records/**"
      - "scripts/**"
      - "tests/**"
      - "requirements-dev.txt"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_metadata.py records/examples/illustrative-record.json records/angola/*.json
      - run: python scripts/validate_sources.py
      - run: python -m unittest discover -s tests
      - run: python scripts/catalog.py check-graph
