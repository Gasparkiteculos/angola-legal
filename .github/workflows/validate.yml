name: Validate document metadata and source registry

on:
  push:
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "requirements.txt"
      - "deploy/**"
      - "web/**"
      - "schemas/**"
      - "sources/**"
      - "records/**"
      - "scripts/**"
      - "tests/**"
      - "web/**"
      - "docs/**"
      - "requirements-dev.txt"
      - "VERSION"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "schemas/**"
      - "sources/**"
      - "records/**"
      - "scripts/**"
      - "tests/**"
      - "requirements-dev.txt"
      - "VERSION"
      - "README.md"
      - "CHANGELOG.md"
      - ".github/workflows/validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate_metadata.py records/examples/illustrative-record.json records/angola/*.json
      - run: python scripts/validate_sources.py
      - run: python -m unittest discover -s tests
      - run: python -c "import json; from jsonschema import Draft202012Validator, FormatChecker; schema=json.load(open('schemas/catalogue-coverage.schema.json', encoding='utf-8')); data=json.load(open('coverage/catalogue-coverage.json', encoding='utf-8')); Draft202012Validator.check_schema(schema); Draft202012Validator(schema, format_checker=FormatChecker()).validate(data)"
      - run: python scripts/catalog.py check-graph
      - run: python scripts/catalog.py coverage
      - run: python -m py_compile scripts/api.py scripts/catalog.py
      - run: node --check web/app.js
